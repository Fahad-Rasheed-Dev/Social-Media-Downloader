services:
  - type: web
    name: saveflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pip3 install -U yt-dlp && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
